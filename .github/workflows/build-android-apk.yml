name: Build Android APK (MuPDF + Gemini Quiz)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake ninja-build curl libgl1-mesa-dev

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Clone MuPDF
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/ArtifexSoftware/mupdf.git mupdf-src

      - name: Build MuPDF for Android
        working-directory: mupdf-src
        run: |
          export NDK="$ANDROID_NDK_ROOT"
          export ANDROID_NDK="$ANDROID_NDK_ROOT"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          make clean || true
          make -j"$(nproc)" \
            build=release \
            OS=Android \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CC="aarch64-linux-android24-clang -fPIC" \
            XCFLAGS="-fPIC" \
            AR=llvm-ar \
            RANLIB=llvm-ranlib \
            USE_SYSTEM_LIBS=no \
            libs

          find build -name "libmupdf.a" -print

          test -f build/release/libmupdf.a

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: "6.7.3"
          host: all_os
          target: android
          arch: android_arm64_v8a
          archives: "qtbase qtdeclarative qtsvg"
          modules: "qtshadertools"
          aqtversion: "==3.3.0"
          setup-python: false
          cache: false
          install-deps: true

      - name: Install ICU 73 libraries for Qt host tools
        shell: bash
        run: |
          mkdir -p /tmp/icu73/extracted
          DEB_NAME=$(
            curl -fsSL http://archive.ubuntu.com/ubuntu/pool/main/i/icu/ \
              | grep -oE 'libicu73_73\.[0-9]+-[0-9]+ubuntu[0-9.]+_amd64\.deb' \
              | sort -V \
              | tail -n 1
          )
          test -n "$DEB_NAME"
          echo "Baixando pacote ICU 73: $DEB_NAME"
          curl -fsSL "http://archive.ubuntu.com/ubuntu/pool/main/i/icu/${DEB_NAME}" -o /tmp/icu73/libicu73.deb
          dpkg-deb -x /tmp/icu73/libicu73.deb /tmp/icu73/extracted
          sudo cp -a /tmp/icu73/extracted/usr/lib/x86_64-linux-gnu/libicu*.so.73* /usr/local/lib/
          sudo ldconfig
          ls -la /usr/local/lib/libicui18n.so.73*

      - name: Verify Qt installation
        run: |
          echo "Qt root: $QT_ROOT_DIR"
          echo "Qt host: $QT_HOST_PATH"

          if [ ! -d "$QT_ROOT_DIR" ]; then
            echo "Erro: diretório do Qt não encontrado."
            exit 1
          fi

          find "$QT_ROOT_DIR" -name qt-cmake -type f
          find "$QT_ROOT_DIR" -name androiddeployqt -type f

      - name: Configure project with CMake
        run: |
          QT_ANDROID_BIN=$(find "$QT_ROOT_DIR" -name qt-cmake -type f | head -n 1)
          QT_GCC_LIB=$(find / -path "*6.7.3/gcc_64/lib" -type d 2>/dev/null | head -n 1)
          export LD_LIBRARY_PATH="/usr/local/lib:${QT_GCC_LIB}:${LD_LIBRARY_PATH}"

          MUPDF_LIB=$(find "$(pwd)/mupdf-src/build" -name libmupdf.a | head -n 1)

          if [ -z "$QT_ANDROID_BIN" ]; then
            echo "Erro: qt-cmake não encontrado."
            exit 1
          fi

          if [ -z "$MUPDF_LIB" ]; then
            echo "Erro: libmupdf.a não encontrada."
            exit 1
          fi

          echo "Usando qt-cmake: $QT_ANDROID_BIN"
          echo "Usando MuPDF: $MUPDF_LIB"

          "$QT_ANDROID_BIN" \
            -S . \
            -B build-android \
            -DANDROID_ABI=arm64-v8a \
            -DENABLE_MUPDF=ON \
            -DMUPDF_INCLUDE_DIR="$(pwd)/mupdf-src/include" \
            -DMUPDF_LIBRARY="$MUPDF_LIB"

      - name: Build Android project
        run: |
          QT_GCC_LIB=$(find / -path "*6.7.3/gcc_64/lib" -type d 2>/dev/null | head -n 1)
          export LD_LIBRARY_PATH="/usr/local/lib:${QT_GCC_LIB}:${LD_LIBRARY_PATH}"
          cmake --build build-android --parallel

      - name: Generate APK
        run: |
          ANDROIDDEPLOYQT=$(find "$QT_ROOT_DIR" -name androiddeployqt -type f | head -n 1)

          if [ -z "$ANDROIDDEPLOYQT" ]; then
            echo "Erro: androiddeployqt não encontrado."
            exit 1
          fi

          if [ ! -f build-android/android-quiz_frontend-deployment-settings.json ]; then
            echo "Erro: arquivo de deployment do Android não encontrado."
            echo "Arquivos disponíveis:"
            find build-android -maxdepth 3 -type f
            exit 1
          fi

          "$ANDROIDDEPLOYQT" \
            --input build-android/android-quiz_frontend-deployment-settings.json \
            --output build-android/apk-out \
            --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gemini-quiz-mupdf-apk
          path: build-android/apk-out/build/outputs/apk/debug/*.apk
          if-no-files-found: error
