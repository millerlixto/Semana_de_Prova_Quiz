
name: Build Android APK (MuPDF + Gemini Quiz)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # --------------------------------------------------
      # 1. Baixar projeto
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Dependências Linux
      # --------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            ninja-build \
            curl \
            wget \
            tar \
            perl \
            python3 \
            pkg-config \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-cursor0 \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev

      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 4. Android SDK e NDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

          test -f "$ANDROID_HOME/platforms/android-34/android.jar"

          echo "Android SDK 34 instalado e validado."

      # --------------------------------------------------
      # 5. Baixar MuPDF e submódulos
      # --------------------------------------------------
      - name: Clone MuPDF
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --recurse-submodules \
            https://github.com/ArtifexSoftware/mupdf.git \
            mupdf-src

          cd mupdf-src

          git submodule update --init --recursive

          echo "MuPDF baixado."
          git log -1 --oneline

      # --------------------------------------------------
      # 6. Compilar MuPDF para Android ARM64
      # --------------------------------------------------
      - name: Build MuPDF for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_NDK_ROOT"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_BUILD="$NDK/ndk-build"

          export PATH="$TOOLCHAIN:$PATH"

          LLVM_AR="$TOOLCHAIN/llvm-ar"
          LLVM_RANLIB="$TOOLCHAIN/llvm-ranlib"
          LLVM_READELF="$TOOLCHAIN/llvm-readelf"

          test -x "$NDK_BUILD"
          test -x "$LLVM_AR"
          test -x "$LLVM_RANLIB"
          test -x "$LLVM_READELF"
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"

          echo "Android NDK: $NDK"

          "$TOOLCHAIN/aarch64-linux-android24-clang" --version

          cd mupdf-src

          echo "Gerando arquivos do MuPDF..."

          make generate

          rm -rf build/android
          rm -rf build/android-arm64

          mkdir -p build/android

          echo "Compilando MuPDF com Android.mk oficial..."

          "$NDK_BUILD" -j"$(nproc)" \
            APP_BUILD_SCRIPT="$PWD/platform/java/Android.mk" \
            APP_PROJECT_PATH="$PWD/build/android" \
            APP_PLATFORM=android-24 \
            APP_ABI=arm64-v8a \
            APP_OPTIM=release \
            APP_STL=c++_shared \
            NDK_OUT="$PWD/build/android/obj" \
            NDK_LIBS_OUT="$PWD/build/android/libs"

          OBJ_DIR="$PWD/build/android/obj/local/arm64-v8a"

          echo "Verificando bibliotecas geradas..."

          test -d "$OBJ_DIR"
          test -f "$OBJ_DIR/libmupdf_core.a"

          find "$OBJ_DIR" \
            -maxdepth 1 \
            -type f \
            -name "libmupdf*.a" \
            -print

          validate_archive() {
            local archive="$1"
            local member_count
            local arm64_count

            member_count=$(
              "$LLVM_AR" t "$archive" |
              awk 'NF { count++ } END { print count + 0 }'
            )

            arm64_count=$(
              "$LLVM_READELF" -h "$archive" 2>/dev/null |
              grep -c "Machine:.*AArch64" || true
            )

            echo "Arquivo: $(basename "$archive")"
            echo "Objetos: $member_count"
            echo "Objetos ARM64: $arm64_count"

            if [ "$member_count" -eq 0 ]; then
              echo "ERRO: biblioteca sem objetos: $archive"
              return 1
            fi

            if [ "$member_count" -ne "$arm64_count" ]; then
              echo "ERRO: arquitetura incompatível em: $archive"
              return 1
            fi
          }

          echo "Validando bibliotecas individuais..."

          mapfile -t MUPDF_ARCHIVES < <(
            find "$OBJ_DIR" \
              -maxdepth 1 \
              -type f \
              -name "libmupdf*.a" \
              | sort
          )

          if [ "${#MUPDF_ARCHIVES[@]}" -lt 2 ]; then
            echo "ERRO: bibliotecas estáticas do MuPDF incompletas."
            exit 1
          fi

          for lib in "${MUPDF_ARCHIVES[@]}"; do
            validate_archive "$lib"
          done

          MUPDF_DIR="$PWD/build/android-arm64"

          mkdir -p "$MUPDF_DIR"

          MUPDF_LIB="$MUPDF_DIR/libmupdf.a"

          echo "Bibliotecas que serão reunidas:"
          printf '%s\n' "${MUPDF_ARCHIVES[@]}"

          rm -f "$MUPDF_LIB"

          {
            printf 'CREATE %s\n' "$MUPDF_LIB"

            for lib in "${MUPDF_ARCHIVES[@]}"; do
              printf 'ADDLIB %s\n' "$lib"
            done

            printf 'SAVE\n'
            printf 'END\n'

          } | "$LLVM_AR" -M

          "$LLVM_RANLIB" "$MUPDF_LIB"

          test -s "$MUPDF_LIB"

          echo "Validando biblioteca MuPDF agregada..."

          validate_archive "$MUPDF_LIB"

          echo "MuPDF ARM64 compilado e validado."

          echo "MUPDF_LIBRARY=$MUPDF_LIB" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 7. Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --------------------------------------------------
      # 8. Instalar Qt 6.7.3 para Android
      # --------------------------------------------------
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: "6.7.3"
          host: all_os
          target: android
          arch: android_arm64_v8a
          archives: "qtbase qtdeclarative qtsvg"
          modules: "qtshadertools"
          aqtversion: "==3.3.0"
          setup-python: false
          cache: false
          install-deps: true

      # --------------------------------------------------
      # 9. Compilar ICU 73.2 para ferramentas Qt Host
      # --------------------------------------------------
      - name: Build and install ICU 73.2
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/icu73
          cd /tmp/icu73

          echo "Baixando ICU 73.2..."

          curl -fSL --retry 3 \
            https://github.com/unicode-org/icu/releases/download/release-73-2/icu4c-73_2-src.tgz \
            -o icu4c-73_2-src.tgz

          tar -xzf icu4c-73_2-src.tgz

          cd icu/source

          echo "Configurando ICU..."

          ./configure \
            --prefix=/usr/local \
            --enable-shared \
            --disable-static

          echo "Compilando ICU..."

          make -j"$(nproc)"

          sudo make install
          sudo ldconfig

          test -f /usr/local/lib/libicuuc.so.73
          test -f /usr/local/lib/libicui18n.so.73

          echo "ICU 73.2 instalada."

      # --------------------------------------------------
      # 10. Verificar Qt e ferramentas Android
      # --------------------------------------------------
      - name: Verify Qt installation
        shell: bash
        run: |
          set -euo pipefail

          echo "Qt root: $QT_ROOT_DIR"
          echo "Qt host: $QT_HOST_PATH"

          test -d "$QT_ROOT_DIR"
          test -d "$QT_HOST_PATH"

          QT_ANDROID_BIN="$(
            find "$QT_ROOT_DIR" \
                 "$QT_HOST_PATH" \
              -name qt-cmake \
              -type f \
              -print -quit
          )"

          ANDROIDDEPLOYQT="$(
            find "$QT_HOST_PATH" \
                 "$QT_ROOT_DIR" \
              -name androiddeployqt \
              -type f \
              -print -quit
          )"

          test -n "$QT_ANDROID_BIN"
          test -n "$ANDROIDDEPLOYQT"
          test -x "$QT_ANDROID_BIN"
          test -x "$ANDROIDDEPLOYQT"

          test -f "$ANDROID_HOME/platforms/android-34/android.jar"

          echo "qt-cmake: $QT_ANDROID_BIN"
          echo "androiddeployqt: $ANDROIDDEPLOYQT"
          echo "Android platform: android-34"

          "$ANDROIDDEPLOYQT" --help 2>&1 | grep -A 2 -- "--android-platform"

          echo "QT_ANDROID_BIN=$QT_ANDROID_BIN" >> "$GITHUB_ENV"
          echo "ANDROIDDEPLOYQT=$ANDROIDDEPLOYQT" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 11. Configurar CMake
      # --------------------------------------------------
      - name: Configure project with CMake
        shell: bash
        run: |
          set -euo pipefail

          QT_GCC_LIB="$QT_HOST_PATH/lib"

          export LD_LIBRARY_PATH="/usr/local/lib:$QT_GCC_LIB:${LD_LIBRARY_PATH:-}"

          MUPDF_LIB="$MUPDF_LIBRARY"
          MUPDF_INCLUDE="$GITHUB_WORKSPACE/mupdf-src/include"

          test -x "$QT_ANDROID_BIN"
          test -f "$MUPDF_LIB"
          test -f "$MUPDF_INCLUDE/mupdf/fitz.h"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"

          echo "Qt Android: $QT_ANDROID_BIN"
          echo "Qt Host: $QT_HOST_PATH"
          echo "MuPDF include: $MUPDF_INCLUDE"
          echo "MuPDF library: $MUPDF_LIB"
          echo "Android compile platform: android-34"

          "$QT_ANDROID_BIN" \
            -S . \
            -B build-android \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DENABLE_MUPDF=ON \
            -DMUPDF_INCLUDE_DIR="$MUPDF_INCLUDE" \
            -DMUPDF_LIBRARY="$MUPDF_LIB"

          echo "CMake configurado."

      # --------------------------------------------------
      # 12. Compilar aplicativo Android
      # --------------------------------------------------
      - name: Build Android project
        shell: bash
        run: |
          set -euo pipefail

          QT_GCC_LIB="$QT_HOST_PATH/lib"

          export LD_LIBRARY_PATH="/usr/local/lib:$QT_GCC_LIB:${LD_LIBRARY_PATH:-}"

          echo "Compilando projeto Android..."

          cmake --build build-android \
            --parallel "$(nproc)"

          echo "Compilação concluída!"

      # --------------------------------------------------
      # 13. Gerar APK - CORRIGIDO
      # --------------------------------------------------
      - name: Generate APK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Localizando androiddeployqt..."

          test -x "$ANDROIDDEPLOYQT"

          DEPLOYMENT_FILE="$(
            find build-android \
              -type f \
              -name "*deployment-settings.json" \
              -print -quit
          )"

          if [ -z "$DEPLOYMENT_FILE" ]; then
            echo "ERRO: deployment-settings.json não encontrado."

            find build-android -type f -print

            exit 1
          fi

          QT_GCC_LIB="$QT_HOST_PATH/lib"

          export LD_LIBRARY_PATH="/usr/local/lib:$QT_GCC_LIB:${LD_LIBRARY_PATH:-}"

          APK_OUTPUT="$GITHUB_WORKSPACE/build-android/apk-out"
          APK_DEST="$GITHUB_WORKSPACE/artifacts/GeminiQuiz-MuPDF-arm64.apk"

          mkdir -p "$APK_OUTPUT"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          rm -f "$APK_DEST"

          echo "Deployment: $DEPLOYMENT_FILE"
          echo "Android platform: android-34"
          echo "APK output: $APK_OUTPUT"

          echo "Verificando argumentos do androiddeployqt..."

          "$ANDROIDDEPLOYQT" --help \
            > /tmp/androiddeployqt-help.txt 2>&1

          grep -q -- "--android-platform" \
            /tmp/androiddeployqt-help.txt

          echo "Argumentos validados."

          echo "Iniciando geração do APK..."

          "$ANDROIDDEPLOYQT" \
            --input "$DEPLOYMENT_FILE" \
            --output "$APK_OUTPUT" \
            --android-platform android-34 \
            --verbose

          echo "Procurando APK..."

          mapfile -t APK_FILES < <(
            find "$APK_OUTPUT" \
              -type f \
              -name "*.apk" \
              -print \
              | sort
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERRO: nenhum APK encontrado."

            echo "Conteúdo da pasta de saída:"

            find "$APK_OUTPUT" \
              -maxdepth 8 \
              -type f \
              -print

            echo "Conteúdo do build:"

            find build-android \
              -maxdepth 5 \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK(s) encontrado(s):"
          printf '%s\n' "${APK_FILES[@]}"

          cp "${APK_FILES[0]}" "$APK_DEST"

          if [ ! -s "$APK_DEST" ]; then
            echo "ERRO: APK copiado está vazio."
            exit 1
          fi

          echo "APK gerado com sucesso!"

          ls -lh "$APK_DEST"

          file "$APK_DEST"

      # --------------------------------------------------
      # 14. Publicar APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gemini-quiz-mupdf-apk
          path: artifacts/GeminiQuiz-MuPDF-arm64.apk
          if-no-files-found: error
          retention-days: 14
