
name: Build Android APK (MuPDF + Gemini Quiz)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o projeto
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar ferramentas Linux
      - name: Install build tools for MuPDF
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git

      # 3. Configurar Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 4. Configurar Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      # 5. Instalar Android API e NDK
      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager)"

          echo "Android SDK: $SDK_ROOT"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      # 6. Baixar e compilar MuPDF
      - name: Build MuPDF for Android arm64-v8a
        shell: bash
        run: |
          set -e

          echo "Downloading MuPDF..."

          git clone --depth 1 --recurse-submodules \
            https://github.com/ArtifexSoftware/mupdf.git mupdf-src

          NDK_TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "Building MuPDF..."

          make -C mupdf-src -j$(nproc) \
            CC="$NDK_TOOLCHAIN/aarch64-linux-android24-clang" \
            AR="$NDK_TOOLCHAIN/llvm-ar" \
            RANLIB="$NDK_TOOLCHAIN/llvm-ranlib" \
            USE_SYSTEM_LIBS=no \
            build=release \
            libs

          if [ ! -f mupdf-src/build/release/libmupdf.a ]; then
            echo "ERROR: libmupdf.a not generated."
            exit 1
          fi

          echo "MuPDF build completed."

      # 7. Configurar Python compatível com a instalação do Qt
      - name: Set up Python for Qt installer
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # 8. Instalar Qt para Android ARM64
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          archives: "qtbase qtdeclarative"
          modules: "qtshadertools qtsvg"
          aqtversion: "==3.3.0"
          setup-python: false
          cache: true

      # 9. Configurar e compilar o projeto
      - name: Configure and build with CMake + MuPDF
        shell: bash
        run: |
          set -e

          QT_ANDROID_BIN=$(find / -name qt-cmake -path "*android*" 2>/dev/null | head -n 1)

          MUPDF_LIB=$(find "$(pwd)/mupdf-src/build" \
            -name libmupdf.a | head -n 1)

          if [ -z "$QT_ANDROID_BIN" ]; then
            echo "ERROR: qt-cmake not found."
            exit 1
          fi

          if [ -z "$MUPDF_LIB" ]; then
            echo "ERROR: libmupdf.a not found."
            exit 1
          fi

          echo "Qt CMake: $QT_ANDROID_BIN"
          echo "MuPDF library: $MUPDF_LIB"

          "$QT_ANDROID_BIN" -S . -B build-android \
            -DANDROID_ABI=arm64-v8a \
            -DENABLE_MUPDF=ON \
            -DMUPDF_INCLUDE_DIR="$(pwd)/mupdf-src/include" \
            -DMUPDF_LIBRARY="$MUPDF_LIB"

          cmake --build build-android --parallel

      # 10. Gerar APK
      - name: Package APK with androiddeployqt
        shell: bash
        run: |
          set -e

          ANDROIDDEPLOYQT=$(find / -name androiddeployqt 2>/dev/null | head -n 1)

          if [ -z "$ANDROIDDEPLOYQT" ]; then
            echo "ERROR: androiddeployqt not found."
            exit 1
          fi

          "$ANDROIDDEPLOYQT" \
            --input build-android/android-quiz_frontend-deployment-settings.json \
            --output build-android/apk-out \
            --apk

      # 11. Disponibilizar APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-quiz-mupdf-apk
          path: build-android/apk-out/build/outputs/apk/debug/*.apk
          if-no-files-found: error
