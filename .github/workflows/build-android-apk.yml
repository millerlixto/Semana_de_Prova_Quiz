name: Build Android APK (MuPDF + Gemini Quiz)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # --------------------------------------------------
      # 1. Baixar projeto
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Dependências Linux
      # --------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            ninja-build \
            curl \
            wget \
            tar \
            perl \
            python3 \
            pkg-config \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-cursor0 \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev

      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 4. Android SDK e NDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 5. Baixar MuPDF
      # --------------------------------------------------
      - name: Clone MuPDF
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/ArtifexSoftware/mupdf.git mupdf-src

      # --------------------------------------------------
      # 6. Compilar MuPDF para Android ARM64
      #    IMPORTANTE: CXX também precisa ser o compilador
      #    cruzado do NDK. Sem isso, arquivos .cpp como
      #    tessocr.o e zxingbarcode.o podem sair como x86_64.
      # --------------------------------------------------
      - name: Build MuPDF for Android ARM64
        shell: bash
        working-directory: mupdf-src
        run: |
          set -euo pipefail

          NDK="$ANDROID_NDK_ROOT"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="$TOOLCHAIN:$PATH"

          export CC="$TOOLCHAIN/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          export AR="$TOOLCHAIN/llvm-ar"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"
          export LD="$TOOLCHAIN/ld.lld"
          export STRIP="$TOOLCHAIN/llvm-strip"
          export NM="$TOOLCHAIN/llvm-nm"

          echo "NDK: $NDK"
          echo "CC: $CC"
          echo "CXX: $CXX"
          "$CC" --version
          "$CXX" --version

          # Remove qualquer objeto ou biblioteca anterior.
          rm -rf build/release

          echo "Compilando MuPDF para Android ARM64..."

          make -j"$(nproc)" \
            build=release \
            OS=Android \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            LD="$LD" \
            STRIP="$STRIP" \
            NM="$NM" \
            USE_SYSTEM_LIBS=no \
            libs

          MUPDF_LIB="$PWD/build/release/libmupdf.a"

          if [ ! -f "$MUPDF_LIB" ]; then
            echo "ERRO: libmupdf.a não foi gerada."
            find build -name "libmupdf*.a" -type f -print || true
            exit 1
          fi

          echo "Verificando arquitetura dos objetos dentro de libmupdf.a..."

          VERIFY_DIR="$(mktemp -d)"
          (
            cd "$VERIFY_DIR"
            "$AR" x "$MUPDF_LIB"

            OBJECT_COUNT=0
            for object in *.o; do
              [ -f "$object" ] || continue
              OBJECT_COUNT=$((OBJECT_COUNT + 1))

              if ! "$TOOLCHAIN/llvm-readelf" -h "$object" 2>/dev/null \
                | grep -q "AArch64"; then
                echo "ERRO: objeto incompatível com Android ARM64: $object"
                "$TOOLCHAIN/llvm-readelf" -h "$object" || true
                exit 1
              fi
            done

            if [ "$OBJECT_COUNT" -eq 0 ]; then
              echo "ERRO: nenhum objeto foi encontrado dentro da biblioteca."
              exit 1
            fi

            echo "Objetos verificados: $OBJECT_COUNT"
          )
          rm -rf "$VERIFY_DIR"

          echo "MuPDF ARM64 compilado e validado com sucesso!"

      # --------------------------------------------------
      # 7. Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # --------------------------------------------------
      # 8. Instalar Qt 6.7.3 para Android
      # --------------------------------------------------
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: "6.7.3"
          host: all_os
          target: android
          arch: android_arm64_v8a
          archives: "qtbase qtdeclarative qtsvg"
          modules: "qtshadertools"
          aqtversion: "==3.3.0"
          setup-python: false
          cache: false
          install-deps: true

      # --------------------------------------------------
      # 9. Compilar e instalar ICU 73.2
      # --------------------------------------------------
      - name: Build and install ICU 73.2
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/icu73
          cd /tmp/icu73

          echo "Baixando ICU 73.2..."

          curl -fSL --retry 3 \
            https://github.com/unicode-org/icu/releases/download/release-73-2/icu4c-73_2-src.tgz \
            -o icu4c-73_2-src.tgz

          echo "Extraindo ICU..."

          tar -xzf icu4c-73_2-src.tgz

          cd icu/source

          echo "Configurando ICU 73.2..."

          ./configure \
            --prefix=/usr/local \
            --enable-shared \
            --disable-static

          echo "Compilando ICU..."

          make -j"$(nproc)"

          echo "Instalando ICU..."

          sudo make install
          sudo ldconfig

          echo "Verificando bibliotecas ICU..."

          ldconfig -p | grep -E 'libicu(uc|i18n|io)\.so\.73'

          test -f /usr/local/lib/libicuuc.so.73
          test -f /usr/local/lib/libicui18n.so.73

          echo "ICU 73.2 instalada com sucesso!"

      # --------------------------------------------------
      # 10. Verificar instalação Qt
      # --------------------------------------------------
      - name: Verify Qt installation
        shell: bash
        run: |
          set -euo pipefail

          echo "Qt root: $QT_ROOT_DIR"
          echo "Qt host: $QT_HOST_PATH"

          if [ ! -d "$QT_ROOT_DIR" ]; then
            echo "Erro: diretório do Qt não encontrado."
            exit 1
          fi

          if [ ! -d "$QT_HOST_PATH" ]; then
            echo "Erro: diretório Qt Host não encontrado."
            exit 1
          fi

          echo "Verificando qt-cmake..."
          find "$QT_ROOT_DIR" -name qt-cmake -type f -print

          echo "Verificando androiddeployqt..."
          find "$QT_ROOT_DIR" -name androiddeployqt -type f -print

          echo "Verificando ferramentas Qt Host..."
          ls -la "$QT_HOST_PATH/bin"

          echo "Qt verificado!"

      # --------------------------------------------------
      # 11. Configurar projeto CMake
      # --------------------------------------------------
      - name: Configure project with CMake
        shell: bash
        run: |
          set -euo pipefail

          QT_ANDROID_BIN="$(find "$QT_ROOT_DIR" \
            -name qt-cmake -type f -print -quit)"

          QT_GCC_LIB="$QT_HOST_PATH/lib"
          export LD_LIBRARY_PATH="/usr/local/lib:$QT_GCC_LIB:${LD_LIBRARY_PATH:-}"

          MUPDF_LIB="$(pwd)/mupdf-src/build/release/libmupdf.a"

          if [ -z "$QT_ANDROID_BIN" ] || [ ! -x "$QT_ANDROID_BIN" ]; then
            echo "Erro: qt-cmake não encontrado ou não executável."
            exit 1
          fi

          if [ ! -f "$MUPDF_LIB" ]; then
            echo "Erro: biblioteca MuPDF ARM64 não encontrada: $MUPDF_LIB"
            exit 1
          fi

          echo "Qt Android: $QT_ANDROID_BIN"
          echo "Qt Host: $QT_HOST_PATH"
          echo "MuPDF ARM64: $MUPDF_LIB"

          echo "Configurando CMake..."

          "$QT_ANDROID_BIN" \
            -S . \
            -B build-android \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DENABLE_MUPDF=ON \
            -DMUPDF_INCLUDE_DIR="$(pwd)/mupdf-src/include" \
            -DMUPDF_LIBRARY="$MUPDF_LIB"

          echo "Configuração CMake concluída!"

      # --------------------------------------------------
      # 12. Compilar aplicativo
      # --------------------------------------------------
      - name: Build Android project
        shell: bash
        run: |
          set -euo pipefail

          QT_GCC_LIB="$QT_HOST_PATH/lib"
          export LD_LIBRARY_PATH="/usr/local/lib:$QT_GCC_LIB:${LD_LIBRARY_PATH:-}"

          echo "Compilando projeto Android..."

          cmake --build build-android --parallel "$(nproc)"

          echo "Compilação concluída!"

      # --------------------------------------------------
      # 13. Gerar APK
      # --------------------------------------------------
      - name: Generate APK
        shell: bash
        run: |
          set -euo pipefail

          ANDROIDDEPLOYQT="$(find "$QT_ROOT_DIR" \
            -name androiddeployqt -type f -print -quit)"

          if [ -z "$ANDROIDDEPLOYQT" ] || [ ! -x "$ANDROIDDEPLOYQT" ]; then
            echo "Erro: androiddeployqt não encontrado ou não executável."
            exit 1
          fi

          DEPLOYMENT_FILE="build-android/android-quiz_frontend-deployment-settings.json"

          if [ ! -f "$DEPLOYMENT_FILE" ]; then
            echo "Erro: arquivo de deployment não encontrado."
            echo "Arquivos disponíveis:"
            find build-android -maxdepth 5 -type f -print
            exit 1
          fi

          QT_GCC_LIB="$QT_HOST_PATH/lib"
          export LD_LIBRARY_PATH="/usr/local/lib:$QT_GCC_LIB:${LD_LIBRARY_PATH:-}"

          echo "Gerando APK..."

          "$ANDROIDDEPLOYQT" \
            --input "$DEPLOYMENT_FILE" \
            --output build-android/apk-out \
            --apk

          echo "Verificando APK..."

          find build-android/apk-out -name "*.apk" -type f -print

      # --------------------------------------------------
      # 14. Publicar APK como artefato
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gemini-quiz-mupdf-apk
          path: build-android/apk-out/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
